<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso à Maestria | Isabella Academy</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;700&family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .checkout-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 5%;
            background: #050505;
            position: relative;
            overflow: hidden;
        }

        /* Efeito de fundo luxuoso */
        .checkout-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 70% 30%, rgba(212, 175, 55, 0.05), transparent 50%);
            z-index: 1;
        }

        .checkout-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(212, 175, 55, 0.15);
            padding: 4rem;
            max-width: 550px;
            width: 100%;
            border-radius: 15px;
            backdrop-filter: blur(20px);
            z-index: 5;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }

        .checkout-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .checkout-header h2 {
            font-family: 'Bodoni Moda', serif;
            color: var(--color-champagne);
            font-size: 2.5rem;
            letter-spacing: 0.2rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .form-group { margin-bottom: 1.8rem; }
        .form-group label {
            display: block;
            margin-bottom: 0.8rem;
            font-size: 0.75rem;
            letter-spacing: 0.15rem;
            color: var(--color-champagne);
            text-transform: uppercase;
            opacity: 0.8;
        }

        .form-group input {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(212, 175, 55, 0.1);
            padding: 1.2rem;
            color: white;
            font-family: 'Montserrat', sans-serif;
            border-radius: 8px;
            font-size: 1rem;
            transition: border 0.3s ease;
        }

        .form-group input:focus {
            border-color: var(--color-champagne);
            outline: none;
        }

        .checkout-btn {
            width: 100%;
            background: var(--color-champagne);
            border: none;
            padding: 1.5rem;
            color: var(--color-obsidian);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.2rem;
            cursor: pointer;
            border-radius: 8px;
            margin-top: 2rem;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            font-size: 1rem;
        }

        .checkout-btn:hover {
            background: white;
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(212, 175, 55, 0.3);
        }

        .secure-footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: 2.5rem;
            font-size: 0.7rem;
            opacity: 0.4;
            color: var(--color-pearl);
            text-transform: uppercase;
            letter-spacing: 0.1rem;
        }
    </style>
</head>
<body>

    <div class="checkout-bg"></div>
    
    <!-- Navigation -->
    <nav class="navbar" id="navbar">
        <button class="nav-hamburger" id="nav-hamburger" aria-label="Menu">
            <span></span><span></span><span></span>
        </button>
        <ul class="nav-links" id="nav-links">
            <li><a href="index.html#hero" class="hover-target">INÍCIO</a></li>
            <li><a href="sobre.html" class="hover-target">SOBRE</a></li>
            <li><a href="index.html#cinema" class="hover-target">VÍDEOS</a></li>
            <li><a href="index.html#gallery" class="hover-target">GALERIA</a></li>
            <li><a href="academy.html" class="hover-target">ACADEMY</a></li>
        </ul>
    </nav>

    <div class="checkout-page">

        <div class="checkout-card reveal">
            <div class="checkout-header">
                <h2>CHECKOUT MESTRIA</h2>
                <p style="font-family: 'Montserrat', sans-serif; font-weight: 200; font-size: 0.9rem; color: var(--color-pearl);">Ambiente seguro e exclusivo para novos alunos.</p>
            </div>

            <form id="checkout-form-final">
                <div class="form-group">
                    <label>CURSO SELECIONADO</label>
                    <input type="text" id="course-display" value="CARREGANDO..." readonly>
                </div>
                <div class="form-group">
                    <label style="display: flex; justify-content: space-between; align-items: center;">
                        NOME DO ALUNO
                        <a href="#" onclick="logoutCheckout()" style="color: var(--color-gold-polished); text-decoration: underline; font-size: 0.6rem; text-transform: uppercase;">Trocar de Conta</a>
                    </label>
                    <input type="text" id="checkout-user-name" value="Carregando..." readonly>
                </div>
                <div class="form-group">
                    <label>NÚMERO DO CARTÃO</label>
                    <input type="text" value="**** **** **** 8892" readonly>
                </div>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="form-group">
                        <label>VALIDADE</label>
                        <input type="text" value="12/28" readonly>
                    </div>
                    <div class="form-group">
                        <label>CVV</label>
                        <input type="text" value="***" readonly>
                    </div>
                </div>

                <button type="submit" class="checkout-btn" id="pay-btn">CONFIRMAR PAGAMENTO</button>
            </form>

            <div class="secure-footer">
                <i data-lucide="lock" size="14"></i>
                CRIPTOGRAFIA DE NÍVEL MILITAR ATIVADA
            </div>
        </div>
    </div>

    <!-- Custom Luxury Alert -->
    <div id="custom-alert-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(10px);">
        <div style="background: rgba(15,15,15,0.95); border: 1px solid rgba(212,175,55,0.3); padding: 3rem; text-align: center; border-radius: 12px; max-width: 400px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);">
            <i data-lucide="check-circle" id="custom-alert-icon" style="color: var(--color-gold-polished); width: 48px; height: 48px; margin-bottom: 1rem; margin-left: auto; margin-right: auto; display: block;"></i>
            <h3 id="custom-alert-title" style="font-family: 'Bodoni Moda', serif; color: var(--color-champagne); font-size: 1.5rem; margin-bottom: 0.5rem; letter-spacing: 2px; text-transform: uppercase;">Sucesso</h3>
            <p id="custom-alert-msg" style="color: rgba(255,255,255,0.7); font-size: 0.8rem; line-height: 1.6; margin-bottom: 2rem;">Sua operação foi realizada.</p>
            <button id="custom-alert-btn" class="checkout-btn" style="margin-top: 0; padding: 1rem;">CONTINUAR</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Lógica de Redirecionamento 100% Funcional (Demo de Fluxo)
        const SUPABASE_URL = 'https://cypatfudsresohfznqij.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN5cGF0ZnVkc3Jlc29oZnpucWlqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5OTk5MjIsImV4cCI6MjA5MDU3NTkyMn0.3So1sNl7jANqg0t4lwvD06A2qdHjvJQD7weMjBFVX5g';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { db: { schema: 'salao' } });

        const params = new URLSearchParams(window.location.search);
        const courseIdParam = params.get('course');
        const display = document.getElementById('course-display');
        let currentUser = null;
        
        let itemsToBuy = [];

        function showCustomAlert(title, msg, type, callback) {
            const modal = document.getElementById('custom-alert-modal');
            const titleEl = document.getElementById('custom-alert-title');
            const msgEl = document.getElementById('custom-alert-msg');
            const iconEl = document.getElementById('custom-alert-icon');
            const btn = document.getElementById('custom-alert-btn');

            titleEl.textContent = title;
            msgEl.textContent = msg;

            if (type === 'error') {
                iconEl.setAttribute('data-lucide', 'x-circle');
                iconEl.style.color = '#ff4d4d';
            } else if (type === 'warning') {
                iconEl.setAttribute('data-lucide', 'alert-circle');
                iconEl.style.color = '#FFA500';
            } else {
                iconEl.setAttribute('data-lucide', 'check-circle');
                iconEl.style.color = 'var(--color-gold-polished)';
            }
            lucide.createIcons();

            modal.style.display = 'flex';

            btn.onclick = () => {
                modal.style.display = 'none';
                if (callback) callback();
            };
        }

        async function initCheckout() {
            const { data: { session } } = await sb.auth.getSession();
            if (!session) {
                showCustomAlert("Acesso Restrito", "Para acessar o checkout, você precisa fazer login ou criar sua conta.", "warning", () => {
                    const redirectUrl = courseIdParam ? `checkout.html?course=${courseIdParam}` : 'checkout.html';
                    window.location.href = `login-aluno.html?mode=signup&redirect=${encodeURIComponent(redirectUrl)}`;
                });
                return;
            }
            
            currentUser = session.user;
            const userName = currentUser.user_metadata?.full_name || currentUser.email.split('@')[0];
            document.getElementById('checkout-user-name').value = userName.toUpperCase();

            // Puxar da sacola ou da URL (para compatibilidade)
            let cart = JSON.parse(localStorage.getItem('Isabella_cart') || '[]');
            if (cart.length > 0) {
                itemsToBuy = cart;
            } else if (courseIdParam) {
                const { data: course } = await sb.from('courses').select('*').eq('id', courseIdParam).single();
                if (course) {
                    itemsToBuy = [{ id: course.id, title: course.title, price: course.price }];
                }
            }

            if (itemsToBuy.length === 0) {
                display.value = 'SACOLA VAZIA';
                return;
            }

            if (itemsToBuy.length === 1) {
                display.value = itemsToBuy[0].title.toUpperCase();
            } else {
                const total = itemsToBuy.reduce((sum, item) => sum + Number(item.price || 0), 0);
                display.value = `${itemsToBuy.length} CURSOS NA SACOLA - R$ ${total.toFixed(2)}`;
            }
        }
        
        initCheckout();

        document.getElementById('checkout-form-final').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('pay-btn');
            btn.innerHTML = "PROCESSANDO TRANSAÇÃO...";
            btn.disabled = true;
            btn.style.opacity = "0.6";

            if (!currentUser) return;

            try {
                if (itemsToBuy.length === 0) {
                    throw new Error("Sua sacola está vazia ou o curso não foi selecionado corretamente.");
                }

                // Aguarda 2 segundos para dar sensação de processamento
                await new Promise(resolve => setTimeout(resolve, 2000));

                const inserts = itemsToBuy.map(item => ({
                    user_id: currentUser.id,
                    course_id: item.id
                }));

                // Inserir todos no banco, ignora se já tiver (onConflict handling manual seria o ideal, mas let's loop or insert array)
                for (const row of inserts) {
                    const { error } = await sb.from('user_courses').insert([row]);
                    if (error && error.code !== '23505') { // 23505 = duplicate key
                        throw error;
                    }
                }

                // Limpa a sacola local
                localStorage.removeItem('Isabella_cart');

                showCustomAlert(
                    "PAGAMENTO APROVADO!", 
                    "Sua transação foi processada com sucesso. Redirecionando para o seu painel...", 
                    "success", 
                    () => {
                        window.location.href = `dashboard.html`;
                    }
                );
            } catch (error) {
                console.error("Erro no checkout:", error);
                showCustomAlert(
                    "Erro na Transação", 
                    "Falha ao processar: " + (error.message || "Erro desconhecido") + ". Tente novamente.", 
                    "error", 
                    () => {
                        btn.innerHTML = "CONFIRMAR PAGAMENTO";
                        btn.disabled = false;
                        btn.style.opacity = "1";
                    }
                );
            }
        });

        async function logoutCheckout() {
            await sb.auth.signOut();
            window.location.href = `login-aluno.html?mode=signup&redirect=${encodeURIComponent(`checkout.html?course=${courseId}`)}`;
        }

        lucide.createIcons();
    </script>
</body>
</html>
