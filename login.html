<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Restrito | Nagila Academy</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            color: #fff;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
        }

        /* Fundo com gradiente sutil */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, #1a1a1a 0%, #0a0a0a 100%);
            opacity: 0.8;
            z-index: -1;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 4rem 3rem;
            background: rgba(15, 15, 15, 0.95);
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 4px; /* Estilo Editorial */
            backdrop-filter: blur(20px);
            text-align: center;
            box-shadow: 0 40px 100px rgba(0,0,0,0.9);
            animation: cardFadeIn 1.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-logo {
            font-family: 'Bodoni Moda', serif;
            font-size: 2.2rem;
            letter-spacing: 0.3em;
            color: #D4AF37;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .login-subtitle {
            font-size: 0.7rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.3);
            margin-bottom: 4rem;
        }

        .form-group {
            position: relative;
            margin-bottom: 2.5rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.65rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #D4AF37;
            margin-bottom: 12px;
            opacity: 0.8;
        }

        .form-group input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 0;
            color: #fff;
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.4s ease;
        }

        .form-group input:focus {
            outline: none;
            border-bottom-color: #D4AF37;
            padding-left: 10px;
        }

        .login-btn {
            width: 100%;
            padding: 1.2rem;
            margin-top: 1.5rem;
            background: transparent;
            color: #D4AF37;
            border: 1px solid #D4AF37;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.5s ease;
            position: relative;
            overflow: hidden;
        }

        .login-btn:hover {
            background: #D4AF37;
            color: #000;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
        }

        .error-msg {
            color: #ff4d4d;
            font-size: 0.8rem;
            margin-top: 2rem;
            display: none;
            font-weight: 400;
        }

        .back-home {
            display: inline-block;
            margin-top: 3rem;
            font-size: 0.6rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.2);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .back-home:hover {
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-logo">NAGILA</div>
        <div class="login-subtitle">Academy Portal</div>

        <form id="login-form">
            <div class="form-group">
                <label for="email">E-mail de Acesso</label>
                <input type="email" id="email" required placeholder="admin@nagilahadad.com.br">
            </div>

            <div class="form-group">
                <label for="password">Chave de Segurança</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>

            <button type="submit" class="login-btn" id="login-button">Autenticar</button>
            <div id="error-msg" class="error-msg">Credenciais inválidas. Tente novamente.</div>
        </form>

        <a href="/inicio" class="back-home">Voltar ao Site Sede</a>
    </div>

    <script>
        // Configuração Supabase (O usuário precisará preencher as chaves no código real)
        const supabaseUrl = 'https://fjuiiivmsfdwsrqiobdu.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZqdWlpaXZtc2Zkd3NycWlvYmR1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2ODIyNjAsImV4cCI6MjA5MTI1ODI2MH0.-FyHmwxUJsloYRD6Wl6fjYrOHGf5CiFcaVgTT89bGMo';

        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        const loginForm = document.getElementById('login-form');
        const loginBtn = document.getElementById('login-button');
        const errorMsg = document.getElementById('error-msg');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            loginBtn.innerText = 'Verificando...';
            errorMsg.style.display = 'none';

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email,
                    password
                });

                if (error) throw error;

                // Sucesso -> Redireciona para /admin (rota limpa)
                window.location.href = '/admin';

            } catch (err) {
                console.error('Erro de Auth:', err.message);
                errorMsg.innerText = 'Falha na autenticação: ' + err.message;
                errorMsg.style.display = 'block';
                loginBtn.innerText = 'Autenticar';
            }
        });

        // Verificação inicial: se já estiver logado, pula a tela
        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                window.location.href = '/admin';
            }
        }
        checkSession();
    </script>
</body>
</html>
