<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Painel | Nagila Academy</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;700&family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            background: #050505;
            color: white;
            font-family: 'Montserrat', sans-serif;
            padding-top: 100px;
        }

        .dashboard-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 2rem 5%;
        }

        .dashboard-header {
            margin-bottom: 4rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 1px solid rgba(212, 175, 55, 0.15);
            padding-bottom: 2rem;
        }

        .dashboard-header h1 {
            font-family: 'Bodoni Moda', serif;
            font-size: 2.5rem;
            color: var(--color-champagne);
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .dashboard-header p {
            font-size: 0.8rem;
            letter-spacing: 3px;
            opacity: 0.6;
            margin-top: 10px;
            text-transform: uppercase;
        }

        .logout-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 6px;
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logout-btn:hover {
            border-color: var(--color-champagne);
            color: var(--color-champagne);
        }

        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
        }

        .course-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(212, 175, 55, 0.1);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.4s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
        }

        .course-card:hover {
            transform: translateY(-8px);
            border-color: var(--color-champagne);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .course-cover {
            width: 100%;
            aspect-ratio: 16/9;
            background: #111;
            position: relative;
            overflow: hidden;
        }

        .course-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .course-card:hover .course-cover img {
            transform: scale(1.05);
        }

        .course-cover-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
        }

        .course-info {
            padding: 1.8rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .course-tag {
            font-size: 0.6rem;
            letter-spacing: 3px;
            color: var(--color-gold-delicate);
            text-transform: uppercase;
            margin-bottom: 0.8rem;
        }

        .course-title {
            font-family: 'Bodoni Moda', serif;
            font-size: 1.3rem;
            color: var(--color-champagne);
            margin-bottom: 1rem;
            line-height: 1.3;
        }

        .course-progress {
            margin-top: auto;
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.05);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--color-champagne);
            width: 0%;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 5rem 2rem;
            border: 1px dashed rgba(212, 175, 55, 0.2);
            border-radius: 15px;
        }

        .empty-state h3 {
            font-family: 'Bodoni Moda', serif;
            color: var(--color-champagne);
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .empty-state a {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 1rem 2rem;
            background: var(--color-gold-polished);
            color: black;
            font-weight: 600;
            text-decoration: none;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.7rem;
        }

        @media (max-width: 768px) {
            .dashboard-header { flex-direction: column; align-items: flex-start; gap: 1.5rem; }
            .dashboard-header h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <nav class="navbar" id="navbar">
        <ul class="nav-links" style="display:flex;">
            <li><a href="/academy.html" class="hover-target">VITRINE DE CURSOS</a></li>
        </ul>
    </nav>

    <main class="dashboard-container">
        <header class="dashboard-header">
            <div>
                <h1 id="user-greeting">MEU PAINEL</h1>
                <p>ACERVO DE OBRAS ADQUIRIDAS</p>
            </div>
            <button class="logout-btn" onclick="logout()">
                <i data-lucide="log-out" style="width: 16px; height: 16px;"></i> SAIR
            </button>
        </header>

        <section class="courses-grid" id="courses-grid">
            <div style="font-size: 0.8rem; opacity: 0.5;">Buscando seus acessos...</div>
        </section>
    </main>

    <script>
        const SUPABASE_URL = 'https://fjuiiivmsfdwsrqiobdu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZqdWlpaXZtc2Zkd3NycWlvYmR1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2ODIyNjAsImV4cCI6MjA5MTI1ODI2MH0.-FyHmwxUJsloYRD6Wl6fjYrOHGf5CiFcaVgTT89bGMo';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function initDashboard() {
            // Verifica sessão real
            const { data: { session } } = await sb.auth.getSession();
            if (!session) {
                window.location.href = 'login-aluno.html';
                return;
            }

            const userName = session.user.user_metadata?.full_name || session.user.email.split('@')[0];
            document.getElementById('user-greeting').innerText = `OLÁ, ${userName.toUpperCase()}`;

            // Busca os cursos adquiridos
            const { data: userCourses, error } = await sb
                .from('user_courses')
                .select('course_id')
                .eq('user_id', session.user.id);

            const grid = document.getElementById('courses-grid');

            if (error || !userCourses || userCourses.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <h3>Nenhum curso encontrado</h3>
                        <p style="font-size: 0.8rem; opacity: 0.6;">Você ainda não possui obras em seu acervo.</p>
                        <a href="academy.html">EXPLORAR ACADEMY</a>
                    </div>
                `;
                return;
            }

            const courseIds = userCourses.map(uc => uc.course_id);
            const { data: courses } = await sb.from('courses').select('*').in('id', courseIds);

            if (!courses || courses.length === 0) {
                grid.innerHTML = `<div class="empty-state"><h3>Cursos indisponíveis no momento.</h3></div>`;
                return;
            }

            grid.innerHTML = courses.map(course => `
                <a href="student-area.html?course=${course.id}" class="course-card">
                    <div class="course-cover">
                        <img src="${course.cover_url || 'assets/em-breve.png'}" alt="Capa">
                        <div class="course-cover-overlay"></div>
                    </div>
                    <div class="course-info">
                        <span class="course-tag">${course.category || 'ACADEMY'}</span>
                        <h3 class="course-title">${course.title}</h3>
                        <div class="course-progress">
                            <div class="progress-fill" style="width: 0%;"></div>
                        </div>
                        <div style="font-size: 0.6rem; opacity: 0.5; margin-top: 10px; letter-spacing: 2px;">CONTINUAR ESTUDOS</div>
                    </div>
                </a>
            `).join('');

            lucide.createIcons();
        }

        async function logout() {
            await sb.auth.signOut();
            window.location.href = 'login-aluno.html';
        }

        initDashboard();
        lucide.createIcons();
    </script>
</body>
</html>
