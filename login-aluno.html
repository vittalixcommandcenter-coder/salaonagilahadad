<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso à Academy | Isabella Lumière</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;700&family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 80px 5%;
            background: #050505;
            position: relative;
            overflow: hidden;
        }

        .login-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.08), transparent 70%);
            z-index: 1;
        }

        .login-card {
            background: rgba(15, 15, 15, 0.95);
            border: 1px solid rgba(212, 175, 55, 0.15);
            padding: 4rem 3.5rem;
            max-width: 460px;
            width: 100%;
            border-radius: 12px;
            backdrop-filter: blur(20px);
            z-index: 5;
            box-shadow: 0 40px 100px rgba(0,0,0,0.9);
            text-align: center;
        }

        .login-logo {
            font-family: 'Bodoni Moda', serif;
            font-size: 2.2rem;
            letter-spacing: 0.3em;
            color: #D4AF37;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .login-subtitle {
            font-size: 0.7rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 3rem;
        }

        .form-group { margin-bottom: 1.8rem; text-align: left; }
        .form-group label {
            display: block;
            margin-bottom: 0.8rem;
            font-size: 0.65rem;
            letter-spacing: 3px;
            color: var(--color-gold-delicate);
            text-transform: uppercase;
            opacity: 0.8;
        }

        .form-group input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 12px 0;
            color: white;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            transition: border 0.3s ease;
        }

        .form-group input:focus {
            border-color: var(--color-champagne);
            outline: none;
        }

        .login-btn {
            width: 100%;
            background: transparent;
            border: 1px solid var(--color-gold-polished);
            padding: 1.2rem;
            color: var(--color-gold-polished);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 4px;
            cursor: pointer;
            margin-top: 2rem;
            transition: all 0.5s ease;
            font-size: 0.75rem;
        }

        .login-btn:hover {
            background: var(--color-gold-polished);
            color: #000;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
        }

        .toggle-mode {
            display: block;
            margin-top: 2rem;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.5);
            text-decoration: none;
            cursor: pointer;
            transition: color 0.3s;
            letter-spacing: 1px;
        }

        .toggle-mode:hover {
            color: var(--color-gold-polished);
        }

        .error-msg {
            color: #ff4d4d;
            font-size: 0.8rem;
            margin-top: 1rem;
            display: none;
            font-weight: 400;
        }
    </style>
</head>
<body>

    <div class="login-bg"></div>
    
    <nav class="navbar" id="navbar">
        <button class="nav-hamburger" id="nav-hamburger" aria-label="Menu">
            <span></span><span></span><span></span>
        </button>
        <ul class="nav-links" id="nav-links">
            <li><a href="/academy" class="hover-target"><i data-lucide="chevron-left" style="width:14px;height:14px;display:inline-block;vertical-align:middle;"></i> VITRINE</a></li>
            <li><a href="/inicio" class="hover-target">INÍCIO</a></li>
        </ul>
    </nav>

    <div class="login-page">
        <div class="login-card">
            <div class="login-logo">Isabella</div>
            <div class="login-subtitle">Área do Aluno</div>
            
            <form id="auth-form">
                <div class="form-group" id="name-group" style="display: none;">
                    <label>Seu Nome Completo</label>
                    <input type="text" id="auth-name" placeholder="Ex: Maria Clara">
                </div>
                <div class="form-group">
                    <label>E-mail de Acesso</label>
                    <input type="email" id="auth-email" required placeholder="seu@email.com">
                </div>
                <div class="form-group">
                    <label>Senha de Segurança</label>
                    <input type="password" id="auth-password" required placeholder="••••••••">
                </div>
                
                <button type="submit" class="login-btn" id="auth-button">ENTRAR NA ACADEMY</button>
                <div id="auth-error-msg" class="error-msg"></div>
            </form>

            <a class="toggle-mode" id="toggle-mode-btn" onclick="toggleMode()">Não tem uma conta? Cadastre-se</a>
        </div>
    </div>

    <style>
        @media (max-width: 480px) {
            .login-card {
                padding: 3rem 1.5rem;
                border: none;
                background: transparent;
                box-shadow: none;
            }
            .login-logo {
                font-size: 1.8rem;
            }
        }
    </style>

    <script>
        const SUPABASE_URL = 'https://cypatfudsresohfznqij.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN5cGF0ZnVkc3Jlc29oZnpucWlqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5OTk5MjIsImV4cCI6MjA5MDU3NTkyMn0.3So1sNl7jANqg0t4lwvD06A2qdHjvJQD7weMjBFVX5g';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { db: { schema: 'salao' } });

        let isLogin = true;

        async function checkSession() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('mode') === 'signup' && isLogin) {
                toggleMode();
            }

            const { data: { session } } = await sb.auth.getSession();
            if (session) {
                const storedRedirect = sessionStorage.getItem('Isabella_redirect');
                sessionStorage.removeItem('Isabella_redirect');
                
                const redirect = storedRedirect || params.get('redirect') || 'dashboard.html';
                window.location.href = redirect;
            }
        }
        checkSession();

        function toggleMode() {
            isLogin = !isLogin;
            const nameGroup = document.getElementById('name-group');
            const authBtn = document.getElementById('auth-button');
            const toggleBtn = document.getElementById('toggle-mode-btn');
            const errorMsg = document.getElementById('auth-error-msg');
            
            errorMsg.style.display = 'none';

            if (isLogin) {
                nameGroup.style.display = 'none';
                authBtn.textContent = 'ENTRAR NA ACADEMY';
                toggleBtn.textContent = 'Não tem uma conta? Cadastre-se';
            } else {
                nameGroup.style.display = 'block';
                authBtn.textContent = 'CRIAR CONTA E ENTRAR';
                toggleBtn.textContent = 'Já possui uma conta? Acesse aqui';
            }
        }

        function showError(msg) {
            const errorMsg = document.getElementById('auth-error-msg');
            errorMsg.textContent = msg;
            errorMsg.style.display = 'block';
        }

        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('auth-button');
            const originalText = btn.textContent;
            btn.textContent = 'PROCESSANDO...';
            btn.disabled = true;
            document.getElementById('auth-error-msg').style.display = 'none';

            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value.trim();
            
            try {
                if (isLogin) {
                    const { error } = await sb.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                } else {
                    const name = document.getElementById('auth-name').value.trim();
                    if (!name) throw new Error("Preencha seu nome completo.");
                    
                    const { error } = await sb.auth.signUp({
                        email,
                        password,
                        options: { data: { full_name: name } }
                    });
                    if (error) throw error;
                    // Auto login after signup (if email confirmation is off)
                }

                // Redirect
                const params = new URLSearchParams(window.location.search);
                const storedRedirect = sessionStorage.getItem('Isabella_redirect');
                sessionStorage.removeItem('Isabella_redirect');
                
                const redirect = storedRedirect || params.get('redirect') || 'dashboard.html';
                window.location.href = redirect;

            } catch (err) {
                showError('Erro: ' + (err.message || 'Credenciais inválidas.'));
                btn.textContent = originalText;
                btn.disabled = false;
            }
        });

        lucide.createIcons();
    </script>
</body>
</html>
